notes: >
  Generative (0-shot), thinking allowed (OpenAI Harmony format's `analysis`
  channel) -- vLLM backend for throughput over the plain `hf` path (an
  unpatched HF-backend run works but projects to ~9 days at full scale vs. ~1
  day on vLLM). `milu_api_nostop` (part of patches/) avoids cutting generation
  off mid-reasoning, since Harmony's analysis channel often contains a blank
  line before the final answer.

  One disclosed patch to this project's vLLM install (not vendor/MILU):
  `vllm/model_executor/models/gpt_oss.py`'s attention init accessed
  `config.rope_theta` directly -- transformers>=5.x moved it into a nested
  `rope_parameters` dict for this checkpoint, so this needed the same fallback
  pattern already applied to vLLM's `llama.py` for Llama 4 Scout/Mistral/Phi-4
  (see those configs' notes). mxfp4 quantization needs no patch on this vLLM
  path (a separate, torch-version-independent implementation from
  transformers' own Mxfp4Config, which does need a workaround on the `hf`
  backend -- see gpt-oss-20b.yaml, not in this curated set).
