notes: >
  Generative (0-shot, JSON-answer) protocol, NOT this roster's standard 5-shot
  loglikelihood -- this checkpoint's tokenizer (`tokenizer_mode: mistral`) cannot
  round-trip through the harness's string-render-then-re-tokenize loglikelihood
  path (confirmed: decoding then re-encoding a chat-templated string does not
  reproduce the original special-token sequence), a hard architectural mismatch
  that affects any harness using this tokenizer mode, not just this project.
  Generative scoring avoids the round-trip entirely.

  Two disclosed patches to this project's vLLM install (not vendor/MILU):
  (1) `model_executor/models/llama.py`'s `rope_theta` lookup falls back to a
  nested `rope_parameters` dict when the flat attribute is missing
  (transformers>=5.x moved it there for this architecture and Phi-4's) --
  without this fix, RoPE silently uses the wrong base with no error. (2) vLLM's
  memory-profiling step now skips generating dummy multimodal input
  (`skip_mm_profiling`/`limit_mm_per_prompt`) for every vllm-backed model in this
  pipeline, since Mistral's natively-multimodal architecture otherwise crashes
  on it even though MILU never sends images.
