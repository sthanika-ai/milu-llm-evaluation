notes: >
  Standard 5-shot loglikelihood protocol -- confirmed not a hybrid-thinking model
  (plain ChatML-style template, no `<think>` tag or reasoning field, unlike
  sarvam-m/qwen3.6-27b/gpt-oss-20b). vLLM backend for throughput over the plain
  `hf` path (see phi-4.yaml).

  One disclosed patch to this project's vLLM install (not vendor/MILU): vLLM
  registers Phi3ForCausalLM as a subclass of LlamaForCausalLM, whose `rope_theta`
  lookup silently returned the wrong default (10000 instead of the real 250000,
  no error) because transformers>=5.x moved it into a nested `rope_parameters`
  dict. Fixed generally in vLLM's own `llama.py`, shared by Mistral's text decoder
  too -- see mistral-small-3.1-24b.yaml's notes; this config is where the bug was
  first found.
