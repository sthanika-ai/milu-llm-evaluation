model_id: qwen3.8-max
serving_backend: local-chat-completions
api_endpoint: qwen/qwen3.8-max
base_url: https://openrouter.ai/api/v1/chat/completions
api_key_env_var: OPENROUTER_API_KEY
access_date: "2026-08-06"
protocol: generate_until
apply_chat_template: true
num_fewshot: 0
num_concurrent: 30
max_retries: 2
timeout_seconds: 600
generation_config:
  temperature: 0.0
  max_gen_toks: 500
  openrouter_reasoning_effort: minimal
  openrouter_exclude_reasoning: true
tasks:
  - milu_api
notes: >
  Generative (0-shot, JSON-answer) via OpenRouter -- reasoning is mandatory for
  this endpoint and cannot be disabled (a true disable was rejected outright:
  "Reasoning is mandatory for this endpoint"), so `openrouter_reasoning_effort:
  minimal` is the real floor, not a true disable, and this row does not get the
  same "no reasoning credit" footing as fully-disabled rows like
  deepseek-v4-flash. `openrouter_exclude_reasoning: true` drops reasoning text
  from the response payload (does not reduce reasoning-token spend/budget).
  `num_concurrent: 30`/`max_retries: 2` avoid a mass-timeout queue-congestion
  failure mode (confirmed not a real network/rate-limit issue) where every
  request's timeout clock started at task creation, not when it got a
  connection slot.

  Two disclosed patches to vendor/MILU's `openai_completions.py` (see
  patches/): (1) coerces a null `content` field to `""` instead of crashing --
  OpenRouter returns `content: null`, not `""`, when this model exhausts its
  budget before answering; (2) logs the real reasoning/completion token split
  and `finish_reason` per call for truncation diagnostics.
