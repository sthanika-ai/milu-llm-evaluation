dataset_path: ai4bharat/MILU
dataset_kwargs:
  token: true
test_split: test
fewshot_split: validation
output_type: generate_until
doc_to_text: !function utils_milu_api.doc_to_text_api
doc_to_target: !function utils_milu_api.doc_to_target_letter
generation_kwargs:
  until: ["\n\n"]
  max_gen_toks: 20
  temperature: 0
  do_sample: false
filter_list:
  - name: "get-answer"
    filter:
      - function: "regex"
        # matches {"answer": "A"} / {"answer":"A"} / bare "A", case-insensitive on the key
        regex_pattern: '"?answer"?\s*:?\s*"?\s*([A-D])\b|^\s*([A-D])\b'
        group_select: 0
        fallback: "[invalid]"
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
